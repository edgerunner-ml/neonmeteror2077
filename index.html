<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NEON METEOR 2077 - 2.5D Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #04010a;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  /* Scanlines CRT sutis e vinheta cinematográfica */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 52%, transparent 64%, rgba(0, 0, 0, 0.52) 100%),
      repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.14) 0 1px, transparent 1px 3px);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c');
const mainG = cv.getContext('2d', { alpha: false });
let g = mainG;
const VW = 500, VH = 920, R = 10, G = 1000, FL = 78, N = 10;
const FONT = "'Orbitron', monospace";
const MONO = "'Share Tech Mono', monospace";
let w, h, dpr, bgStatic, horizonLine, layerA, hudGeom, maxDpr = 2;
const HZ_PAD = 28;

/* ---------- MESA & GEOMETRIA LÓGICA (100% PRESERVADA) ---------- */
const walls = [];
const W = (a, b, c, d, e = .45) => walls.push([a, b, c, d, e]);
(function () {
  let px = 20, py = 270;
  for (let i = 1; i <= 28; i++) {
    const a = Math.PI + Math.PI * i / 28, x = 250 + 230 * Math.cos(a), y = 270 + 230 * Math.sin(a);
    W(px, py, x, y); px = x; py = y;
  }
})();
W(20, 270, 20, 690); W(480, 270, 480, 880); W(440, 880, 480, 880); W(440, 300, 440, 880);
W(20, 690, 135, 790); W(440, 690, 325, 790);

const slings = [[60, 590, 125, 720], [400, 590, 335, 720]];
const slingFlash = [0, 0];

const bumpers = [
  { x: 205, y: 95, r: 19, c: '#ffc61a', glow: '#ff9a00', f: 0, rot: 0 },
  { x: 142, y: 132, r: 19, c: '#ffc61a', glow: '#ff9a00', f: 0, rot: 1.1 },
  { x: 110, y: 190, r: 19, c: '#ffc61a', glow: '#ff9a00', f: 0, rot: 2.2 },
  { x: 115, y: 315, r: 36, c: '#ff2a20', glow: '#ff0000', f: 0, rot: 0.5 }
];

const posts = [
  { x: 90, y: 470, r: 9, f: 0 },
  { x: 370, y: 470, r: 9, f: 0 },
  { x: 60, y: 380, r: 7, f: 0 },
  { x: 400, y: 380, r: 7, f: 0 }
];

const fl = [
  { px: 135, py: 790, d: 1, a: .5, w: 0, trail: [] },
  { px: 325, py: 790, d: -1, a: .5, w: 0, trail: [] }
];
const tip = f => [f.px + f.d * FL * Math.cos(f.a), f.py + FL * Math.sin(f.a)];

/* ---------- ESTADO DO JOGO ---------- */
let state = 'start', score = 0, best = 0, balls = 3, b, waiting = true, power = 0, lost = 0, waitRelease = false;
let msg = '', msgT = 0, msgCol = '#ff2a55', trail = [], shake = 0, tiltM = 0, tilted = false, hits = 0;
let flashScreen = 0, flashCol = '#0ff', plungerSpringOffset = 0;
const lvl = [0, 0, 0];
const particles = [];
const popups = [];
const shockwaves = [];

try { best = +localStorage.getItem('neonpin') || 0; } catch (e) {}

/* ---------- LEADERBOARD NETLIFY FUNCTIONS & SELETOR ARCADE ---------- */
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
let leaderboard = [];
let enteringInitials = false;
let initialsIdx = [13, 4, 14]; // N E O
let cursorSlot = 0;
let lbStatus = 'CARREGANDO TOP 5...';

try {
  const saved = localStorage.getItem('neonpin_name');
  if (saved && saved.length === 3) {
    initialsIdx = [...saved].map(ch => Math.max(0, CHARS.indexOf(ch)));
  }
} catch (e) {}

async function fetchLeaderboard() {
  try {
    const res = await fetch('/.netlify/functions/leaderboard');
    if (res.ok) {
      leaderboard = await res.json();
      lbStatus = leaderboard.length ? '' : 'SEJA O PRIMEIRO NO RANKING!';
      if (leaderboard.length > 0 && leaderboard[0].score > best) {
        best = leaderboard[0].score;
      }
    } else {
      lbStatus = 'RANKING OFFLINE';
    }
  } catch (e) {
    lbStatus = 'RANKING OFFLINE';
  }
}

function checkQualifies(finalScore) {
  if (finalScore <= 0) return false;
  const qualifies = leaderboard.length < 10 || finalScore > leaderboard[leaderboard.length - 1].score;
  if (qualifies) {
    enteringInitials = true;
    cursorSlot = 0;
    snd(900, 0.15, 'triangle', 0.08);
  }
  return qualifies;
}

async function confirmInitials() {
  enteringInitials = false;
  const name = initialsIdx.map(i => CHARS[i]).join('');
  try { localStorage.setItem('neonpin_name', name); } catch (e) {}
  lbStatus = 'SALVANDO RECORDE...';
  snd(1200, 0.25, 'sine', 0.08);

  try {
    const res = await fetch('/.netlify/functions/leaderboard', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, score })
    });
    if (res.ok) {
      leaderboard = await res.json();
      lbStatus = '';
      if (leaderboard.length > 0 && leaderboard[0].score > best) {
        best = leaderboard[0].score;
      }
    } else {
      lbStatus = 'ERRO AO SALVAR';
    }
  } catch (e) {
    lbStatus = 'RANKING OFFLINE';
  }
}

fetchLeaderboard();

const keys = {};

function spawn() {
  tilted = false;
  tiltM = 0;
  b = { x: 460, y: 866, vx: 0, vy: 0 };
  waiting = true;
  power = 0;
  trail = [];
}

function start() {
  if (enteringInitials) return;
  lvl.fill(0);
  hits = 0;
  score = 0;
  balls = 3;
  state = 'play';
  waitRelease = true;
  particles.length = 0;
  popups.length = 0;
  shockwaves.length = 0;
  spawn();
}

function nudge(dx, dy) {
  if (state !== 'play' || lost > 0 || waiting || tilted) return;
  b.vx += dx * 220 + (Math.random() - .5) * 60;
  b.vy += dy * 260 - (dx ? 70 : 0);
  shake = 1.1;
  tiltM += 1;
  snd(80, .12, 'sawtooth', .08);
  spawnSparks(b.x, b.y, '#ffaa00', 8, 120);
  if (tiltM >= 4) {
    tilted = true;
    msg = 'TILT!';
    msgCol = '#ff2244';
    msgT = 2.5;
    flashScreen = 0.35;
    flashCol = '#ff0033';
    snd(60, .6, 'square', .1);
  } else if (tiltM >= 3) {
    msg = 'CUIDADO!';
    msgCol = '#ffaa00';
    msgT = 1;
  }
}

/* ---------- SISTEMA DE PARTÍCULAS & POPUPS ---------- */
function spawnSparks(x, y, col, count = 12, speed = 220, life = 0.45) {
  if (particles.length > 320) return;
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = (0.3 + Math.random() * 0.7) * speed;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      life,
      maxLife: life * (0.7 + Math.random() * 0.5),
      col,
      size: 1.8 + Math.random() * 2.5
    });
  }
}

function addPopup(x, y, text, col = '#0ff', size = 14) {
  popups.push({
    x, y,
    vy: -55,
    text,
    col,
    size,
    life: 0.95,
    maxLife: 0.95
  });
}

function addShockwave(x, y, maxR, col) {
  shockwaves.push({
    x, y,
    r: 8,
    maxR,
    col,
    life: 0.35,
    maxLife: 0.35
  });
}

/* ---------- ÁUDIO WEB AUDIO API (PRESERVADO) ---------- */
let ac;
function snd(f, d = .08, t = 'square', v = .05) {
  try {
    ac = ac || new AudioContext();
    const o = ac.createOscillator(), n = ac.createGain();
    o.type = t; o.frequency.value = f;
    n.gain.setValueAtTime(v, ac.currentTime);
    n.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.connect(n); n.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}

/* ---------- CONTROLES EXCLUSIVOS DE TECLADO ---------- */
addEventListener('keydown', e => {
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;

  // Modo de inserção de iniciais no estilo Arcade
  if (state === 'over' && enteringInitials) {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      cursorSlot = (cursorSlot + 2) % 3;
      snd(420, .05, 'triangle', .06);
    } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      cursorSlot = (cursorSlot + 1) % 3;
      snd(420, .05, 'triangle', .06);
    } else if (e.code === 'ArrowUp' || e.code === 'KeyW') {
      initialsIdx[cursorSlot] = (initialsIdx[cursorSlot] + 1) % CHARS.length;
      snd(640, .05, 'square', .05);
    } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
      initialsIdx[cursorSlot] = (initialsIdx[cursorSlot] - 1 + CHARS.length) % CHARS.length;
      snd(540, .05, 'square', .05);
    } else if (e.code === 'Enter' || e.code === 'Space') {
      confirmInitials();
    }
    return;
  }

  if ((e.code === 'Space' || e.code === 'Enter') && state !== 'play') start();
  if (e.code === 'ArrowUp' || e.code === 'KeyW') nudge(0, -1);
  if (e.code === 'KeyA') nudge(-1, 0);
  if (e.code === 'KeyD') nudge(1, 0);
  if (state === 'play' && (keys.ArrowLeft || keys.KeyZ)) snd(180, .05, 'triangle', .06);
  if (state === 'play' && (keys.ArrowRight || keys.KeyM)) snd(180, .05, 'triangle', .06);
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
});

const inL = () => !tilted && (keys.ArrowLeft || keys.KeyZ || keys.ShiftLeft);
const inR = () => !tilted && (keys.ArrowRight || keys.KeyM || keys.ShiftRight || keys.Slash);
const inCharge = () => keys.Space || keys.ArrowDown;

/* ---------- PROJEÇÃO 2.5D EM PERSPECTIVA PANORÂMICA ---------- */
let camShakeX = 0, camShakeY = 0;

function project(x, y, z = 0) {
  const isLandscape = w >= h * 1.1;
  const v = y / VH;
  const depthCurve = Math.sign(v) * Math.pow(Math.abs(v), 1.36);

  const topY = isLandscape ? h * 0.145 : h * 0.16;
  const botY = h * 0.985;

  const botHalfW = isLandscape ? Math.min(w * 0.455, h * 0.78) : w * 0.48;
  const topHalfW = botHalfW * (isLandscape ? 0.56 : 0.66);

  const halfW = topHalfW + (botHalfW - topHalfW) * depthCurve;
  const normX = (x - VW * 0.5) / (VW * 0.5);

  const perspScale = halfW / (VW * 0.5);
  const syBase = topY + (botY - topY) * depthCurve;
  const sx = w * 0.5 + normX * halfW + camShakeX * perspScale;
  const sy = syBase - z * perspScale * 0.88 + camShakeY * perspScale;

  const localSlope = (botY - topY) * (1.36 * Math.pow(Math.max(0.08, v), 0.36)) / VH;

  return {
    x: sx,
    y: sy,
    s: perspScale,
    syScale: localSlope
  };
}

function traceProjectedPoly(pts, z = 0) {
  g.beginPath();
  pts.forEach((pt, idx) => {
    const p = project(pt[0], pt[1], z);
    if (idx === 0) g.moveTo(p.x, p.y);
    else g.lineTo(p.x, p.y);
  });
  g.closePath();
}

/* ---------- FÍSICA & COLISÕES (100% PRESERVADA) ---------- */
function seg(ax, ay, bx, by, rad, e, f) {
  const dx = bx - ax, dy = by - ay;
  let t = ((b.x - ax) * dx + (b.y - ay) * dy) / (dx * dx + dy * dy);
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const cx = ax + dx * t, cy = ay + dy * t;
  let nx = b.x - cx, ny = b.y - cy;
  const d = Math.hypot(nx, ny), m = R + rad;
  if (d >= m || d === 0) return null;
  nx /= d; ny /= d;
  b.x = cx + nx * m; b.y = cy + ny * m;
  let sx = 0, sy = 0;
  if (f && f.w) {
    const L = t * FL;
    sx = -f.w * L * f.d * Math.sin(f.a);
    sy = f.w * L * Math.cos(f.a);
  }
  const vn = (b.vx - sx) * nx + (b.vy - sy) * ny;
  if (vn < 0) {
    b.vx -= (1 + e) * vn * nx;
    b.vy -= (1 + e) * vn * ny;
  }
  return { nx, ny, vn, cx, cy };
}

function step(dt) {
  const hh = dt / N;
  for (let i = 0; i < N; i++) {
    fl.forEach((f, k) => {
      const tg = (k ? inR() : inL()) ? -.55 : .5, sp = 22;
      if (f.a < tg) { f.a = Math.min(tg, f.a + sp * hh); f.w = sp; }
      else if (f.a > tg) { f.a = Math.max(tg, f.a - sp * hh); f.w = -sp; }
      else f.w = 0;
    });
    b.vy += G * hh;
    b.x += b.vx * hh;
    b.y += b.vy * hh;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > 2200) { b.vx *= 2200 / sp; b.vy *= 2200 / sp; }

    for (const q of walls) {
      const r = seg(q[0], q[1], q[2], q[3], 0, q[4]);
      if (r && r.vn < -350 && i === 0) {
        spawnSparks(r.cx, r.cy, '#ffa030', 5, 140, 0.25);
      }
    }

    fl.forEach(f => {
      const t = tip(f);
      const r = seg(f.px, f.py, t[0], t[1], 9, .3, f);
      if (r && r.vn < -250 && i === 0) {
        spawnSparks(r.cx, r.cy, '#ffd080', 6, 180, 0.3);
      }
    });

    slings.forEach((q, idx) => {
      const r = seg(q[0], q[1], q[2], q[3], 4, .4);
      if (r && r.vn < -120) {
        b.vx += r.nx * 380;
        b.vy += r.ny * 380;
        slingFlash[idx] = 1;
        shake = Math.max(shake, 0.35);
        add(50);
        snd(520, .07, 'sawtooth');
        spawnSparks(r.cx, r.cy, '#ff00ff', 14, 260, 0.4);
        addPopup(r.cx, r.cy - 10, '+50', '#ff66ff', 14);
      }
    });

    for (const o of bumpers) {
      let dx = b.x - o.x, dy = b.y - o.y, d = Math.hypot(dx, dy);
      if (d < R + o.r && d > 0) {
        dx /= d; dy /= d;
        b.x = o.x + dx * (R + o.r);
        b.y = o.y + dy * (R + o.r);
        b.vx = dx * 600;
        b.vy = dy * 600;
        o.f = 1;
        hits++;
        shake = Math.max(shake, 0.45);
        add(100);
        snd(700 + Math.random() * 300, .09, 'square', .07);
        spawnSparks(o.x + dx * o.r, o.y + dy * o.r, o.c, 16, 280, 0.45);
        addShockwave(o.x, o.y, o.r * 2.5, o.c);
        addPopup(o.x, o.y - o.r, '+100', o.c, 16);
      }
    }

    for (const o of posts) {
      let dx = b.x - o.x, dy = b.y - o.y, d = Math.hypot(dx, dy);
      if (d < R + o.r && d > 0) {
        dx /= d; dy /= d;
        b.x = o.x + dx * (R + o.r);
        b.y = o.y + dy * (R + o.r);
        const vn = b.vx * dx + b.vy * dy;
        if (vn < 0) {
          b.vx -= 1.6 * vn * dx;
          b.vy -= 1.6 * vn * dy;
          o.f = 1;
          add(10);
          snd(900, .04, 'triangle', .04);
          spawnSparks(o.x + dx * o.r, o.y + dy * o.r, '#ffee00', 6, 150, 0.25);
        }
      }
    }
  }
}

function add(n) {
  score += n;
  if (score > best) best = score;
}

function update(dt) {
  bumpers.forEach(o => {
    o.f = Math.max(0, o.f - dt * 4);
    o.rot += dt * (1.5 + o.f * 8);
  });
  posts.forEach(o => o.f = Math.max(0, o.f - dt * 5));
  slingFlash[0] = Math.max(0, slingFlash[0] - dt * 5);
  slingFlash[1] = Math.max(0, slingFlash[1] - dt * 5);

  if (msgT > 0) msgT -= dt;
  shake = Math.max(0, shake - dt * 5);
  tiltM = Math.max(0, tiltM - dt * .6);
  flashScreen = Math.max(0, flashScreen - dt * 1.8);
  plungerSpringOffset = Math.max(0, plungerSpringOffset - dt * 6);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 260 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y += p.vy * dt;
    p.vy *= 0.95;
    p.life -= dt;
    if (p.life <= 0) popups.splice(i, 1);
  }

  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.life -= dt;
    sw.r = 8 + (sw.maxR - 8) * (1 - sw.life / sw.maxLife);
    if (sw.life <= 0) shockwaves.splice(i, 1);
  }

  if (Math.random() < 0.65) {
    for (let c = 0; c < 3; c++) {
      const rx = 190 + 40 * c;
      const intensity = 1 + lvl[c] * 0.25;
      particles.push({
        x: rx + (Math.random() - 0.5) * 6,
        y: 616 + Math.random() * 8,
        vx: (Math.random() - 0.5) * 18,
        vy: (45 + Math.random() * 55) * intensity,
        life: 0.25 + lvl[c] * 0.03,
        maxLife: 0.45,
        col: Math.random() < 0.5 ? '#ffaa00' : '#ff3300',
        size: 1.8 + lvl[c] * 0.25
      });
    }
  }

  fl.forEach(f => {
    if (Math.abs(f.w) > 5) f.trail.push({ a: f.a, alpha: 0.55 });
    for (let i = f.trail.length - 1; i >= 0; i--) {
      f.trail[i].alpha -= dt * 4.5;
      if (f.trail[i].alpha <= 0) f.trail.splice(i, 1);
    }
  });

  if (state !== 'play') return;

  if (lost > 0) {
    lost -= dt;
    fl.forEach((f, k) => {
      const tg = (k ? inR() : inL()) ? -.55 : .5;
      f.a += Math.sign(tg - f.a) * Math.min(Math.abs(tg - f.a), 22 * dt);
    });
    if (lost <= 0) {
      if (balls <= 0) {
        state = 'over';
        try { localStorage.setItem('neonpin', best); } catch (e) {}
        checkQualifies(score);
      } else {
        spawn();
      }
    }
    return;
  }

  if (waitRelease && !inCharge()) waitRelease = false;
  const spd = Math.hypot(b.vx, b.vy);
  if (!waiting && b.x > 445 && b.y > 780 && spd < 40) waiting = true;

  if (waiting && !waitRelease) {
    if (inCharge()) {
      power = Math.min(1, power + dt * 1.3);
    } else if (power > 0) {
      b.vy = -(1000 + Math.max(.3, power) * 1250);
      waiting = false;
      plungerSpringOffset = 1;
      spawnSparks(460, 875, '#00ffff', 18, 240, 0.45);
      power = 0;
      snd(220, .25, 'sawtooth', .07);
    }
  }

  const py = b.y;
  step(dt);

  if (py < 500 && b.y >= 500 && b.vy > 0 && b.x > 170 && b.x < 290) {
    const c = Math.min(2, (b.x - 170) / 40 | 0);
    lvl[c] = Math.min(7, lvl[c] + 1);
    const pts = lvl[c] * 500;
    add(pts);
    snd(500 + lvl[c] * 100, .1, 'triangle', .06);
    const lx = 190 + 40 * c;
    spawnSparks(lx, 500, '#00ffaa', 14, 200, 0.45);
    addPopup(lx, 490, '+' + pts, '#00ffaa', 16);

    if (lvl.every(v => v >= 7)) {
      add(10000);
      balls++;
      lvl.fill(0);
      msg = 'FOGUETES! BOLA EXTRA';
      msgCol = '#00ff88';
      msgT = 2.6;
      flashScreen = 0.45;
      flashCol = '#00ffaa';
      shake = 0.8;
      snd(1200, .4, 'sine', .08);
      spawnSparks(230, 500, '#ffff00', 40, 360, 0.85);
      addPopup(230, 460, '+10000 EXTRA BALL!', '#ffff00', 18);
    }
  }

  if (spd > 1150 && Math.random() < 0.55) {
    particles.push({
      x: b.x + (Math.random() - 0.5) * 6,
      y: b.y + (Math.random() - 0.5) * 6,
      vx: -b.vx * 0.1 + (Math.random() - 0.5) * 40,
      vy: -b.vy * 0.1 + (Math.random() - 0.5) * 40,
      life: 0.22,
      maxLife: 0.22,
      col: '#77ffff',
      size: 1.8
    });
  }

  trail.push([b.x, b.y]);
  if (trail.length > 14) trail.shift();

  if (b.y > VH + 30) {
    balls--;
    lost = 1;
    snd(110, .5, 'sawtooth', .08);
    msg = tilted ? 'TILT!' : balls > 0 ? 'BOLA PERDIDA' : '';
    msgCol = '#ff2a55';
    msgT = 1.1;
    flashScreen = 0.28;
    flashCol = '#ff0044';

/* ---------- TEXTO NEON NÍTIDO ---------- */
const glowCache = new Map(), spriteCache = new Map();
const mctx = document.createElement('canvas').getContext('2d');
function getSprite(key, cw, ch, draw) {
  let c = spriteCache.get(key);
  if (!c) {
    if (spriteCache.size > 300) spriteCache.clear();
    c = document.createElement('canvas');
    c.width = Math.ceil(cw * dpr); c.height = Math.ceil(ch * dpr);
    const k = c.getContext('2d');
    k.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(k);
    spriteCache.set(key, c);
  }
  return c;
}
function drawCachedAt(key, p, rad, fn) {
  const SZ = Math.ceil(2 * (rad + 26));
  const x0 = Math.round((p.x - SZ / 2) * dpr) / dpr, y0 = Math.round((p.y - SZ / 2) * dpr) / dpr;
  const c = getSprite(key, SZ, SZ, k => {
    k.translate(-x0, -y0);
    const prev = g; g = k;
    try { fn(); } finally { g = prev; }
  });
  g.drawImage(c, x0, y0, c.width / dpr, c.height / dpr);
}
/* texto neon pré-renderizado (o brilho é calculado 1x e reaproveitado) */
function glowText(t, x, y, size, col, al = 'center', font = FONT, blur = 14) {
  size = Math.round(size * 2) / 2;
  const key = t + '|' + size + '|' + col + '|' + font + '|' + blur;
  let s = glowCache.get(key);
  if (!s) {
    if (glowCache.size > 400) glowCache.clear();
    const f = `900 ${size}px ${font}`;
    mctx.font = f;
    const tw = Math.ceil(mctx.measureText(t).width), pad = Math.ceil(blur * 2 + 4), ch = Math.ceil(size * 1.6) + pad * 2;
    const c = document.createElement('canvas');
    c.width = Math.ceil((tw + pad * 2) * dpr); c.height = Math.ceil(ch * dpr);
    const k = c.getContext('2d');
    k.setTransform(dpr, 0, 0, dpr, 0, 0);
    k.font = f; k.textAlign = 'left'; k.textBaseline = 'middle';
    k.shadowColor = col; k.shadowBlur = blur; k.fillStyle = col;
    k.fillText(t, pad, ch / 2);
    s = { c, tw, pad, ch };
    glowCache.set(key, s);
  }
  const dx = al === 'center' ? -s.tw / 2 : al === 'right' ? -s.tw : 0;
  g.drawImage(s.c, x + dx - s.pad, y - s.ch / 2, s.c.width / dpr, s.c.height / dpr);
}
if (document.fonts) {
  const refreshText = () => glowCache.clear();
  ['900 16px Orbitron', "900 16px 'Share Tech Mono'"].forEach(f => document.fonts.load(f).then(refreshText, () => {}));
  document.fonts.ready.then(refreshText);
}

/* ---------- FUNDO PANORÂMICO SYNTHWAVE ---------- */
const stars = Array.from({ length: 110 }, () => ({
  x: Math.random(),
  y: Math.random() * 0.24,
  r: 0.6 + Math.random() * 1.6,
  phase: Math.random() * Math.PI * 2,
  spd: 1.5 + Math.random() * 3
}));

function buildStaticBg() {
  bgStatic = document.createElement('canvas');
  bgStatic.width = w * dpr;
  bgStatic.height = h * dpr;
  const k = bgStatic.getContext('2d');
  k.scale(dpr, dpr);
  const hz = h * 0.24;

  const gr = k.createLinearGradient(0, 0, 0, hz);
  gr.addColorStop(0, '#020008');
  gr.addColorStop(0.55, '#150330');
  gr.addColorStop(1, '#7a106e');
  k.fillStyle = gr;
  k.fillRect(0, 0, w, hz);

  const sunR = Math.min(w, h) * 0.14;
  const sunX = w * 0.5;
  const sunY = hz - sunR * 0.12;
  k.save();
  k.beginPath();
  k.rect(0, 0, w, hz);
  k.clip();

  const sunGrad = k.createLinearGradient(0, sunY - sunR, 0, hz);
  sunGrad.addColorStop(0, '#fff244');
  sunGrad.addColorStop(0.5, '#ff7b00');
  sunGrad.addColorStop(1, '#ff006a');
  k.shadowColor = '#ff2a85';
  k.shadowBlur = 40;
  k.fillStyle = sunGrad;
  k.beginPath();
  k.arc(sunX, sunY, sunR, 0, Math.PI * 2);
  k.fill();
  k.shadowBlur = 0;

  k.fillStyle = '#2b063b';
  for (let i = 0; i < 5; i++) {
    const sy = sunY + sunR * (0.05 + i * 0.15);
    k.fillRect(sunX - sunR, sy, sunR * 2, 1.8 + i * 1.2);
  }
  k.restore();

  let seed = 9876;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let x = 0; x < w;) {
    const bw = 24 + rnd() * 52;
    const bh = h * (0.03 + rnd() * 0.11);
    k.fillStyle = `rgb(${8 + (rnd() * 10 | 0)}, ${3 + (rnd() * 7 | 0)}, ${22 + (rnd() * 18 | 0)})`;
    k.fillRect(x, hz - bh, bw, bh);
    k.fillStyle = 'rgba(0, 255, 255, 0.18)';
    k.fillRect(x, hz - bh, bw, 1.5);

    for (let wy = hz - bh + 6; wy < hz - 4; wy += 9) {
      for (let wx = x + 4; wx < x + bw - 5; wx += 7) {
        if (rnd() < 0.24) {
          k.fillStyle = ['#00ffff', '#ff00ff', '#ffee00'][rnd() * 3 | 0];
          k.globalAlpha = 0.4 + rnd() * 0.5;
          k.fillRect(wx, wy, 3, 4);
          k.globalAlpha = 1;
        }
      }
    }
    x += bw + 2;
  }

  const floorGr = k.createLinearGradient(0, hz, 0, h);
  floorGr.addColorStop(0, '#120224');
  floorGr.addColorStop(0.4, '#070112');
  floorGr.addColorStop(1, '#020006');
  k.fillStyle = floorGr;
  k.fillRect(0, hz, w, h - hz);
  horizonLine = document.createElement('canvas');
  horizonLine.width = Math.ceil(w * dpr); horizonLine.height = Math.ceil(HZ_PAD * 2 * dpr);
  const q = horizonLine.getContext('2d');
  q.setTransform(dpr, 0, 0, dpr, 0, 0);
  q.shadowColor = '#ff00dd'; q.shadowBlur = 18;
  q.strokeStyle = '#ff44ee'; q.lineWidth = 2;
  q.beginPath(); q.moveTo(0, HZ_PAD); q.lineTo(w, HZ_PAD); q.stroke();
}

function drawAnimatedBg(t) {
  g.drawImage(bgStatic, 0, 0, w, h);
  const hz = h * 0.24;

  g.fillStyle = '#dcf5ff';
  for (const st of stars) {
    g.globalAlpha = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * 0.002 * st.spd + st.phase));
    g.beginPath();
    g.arc(st.x * w, st.y * h, st.r, 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;

  g.save();
  g.beginPath();
  g.rect(0, hz, w, h - hz);
  g.clip();

  g.strokeStyle = 'rgba(255, 0, 212, 0.24)';
  g.lineWidth = 1.2;
  g.beginPath();
  for (let i = -24; i <= 24; i++) {
    g.moveTo(w / 2 + i * 16, hz);
    g.lineTo(w / 2 + i * w / 6.5, h);
  }
  const scroll = (t * 0.0004) % 1;
  const rows = 16;
  for (let i = 0; i < rows; i++) {
    const p = (i + scroll) / rows;
    const y = hz + Math.pow(p, 2.0) * (h - hz);
    g.moveTo(0, y);
    g.lineTo(w, y);
  }
  g.stroke();
  g.restore();

  if (horizonLine) g.drawImage(horizonLine, 0, hz - HZ_PAD, w, HZ_PAD * 2);
}

function resize() {
  dpr = Math.min(devicePixelRatio || 1, maxDpr);

}

    const shapes = [[80, 650, 38, 72], [125, 725, 60, 28], [150, 685, 32, 40]];
    shapes.forEach(e => {
      const cx = m ? 460 - e[0] : e[0];
      const cy = e[1];
      const p = project(cx, cy, 0);
      g.save();
      g.translate(p.x, p.y);
      g.scale(p.s, p.syScale);
      g.fillStyle = 'rgba(255, 120, 0, 0.14)';
      g.strokeStyle = '#ff9a30';
      g.lineWidth = 2.5;
      g.beginPath();
      g.ellipse(0, 0, e[2] + 4, e[3] + 4, 0, 0, Math.PI * 2);
      g.fill();
      g.stroke();

      const eg = g.createLinearGradient(-e[2], -e[3], e[2], e[3]);
      eg.addColorStop(0, '#ff3a20');
      eg.addColorStop(1, '#7a0808');
      g.fillStyle = eg;
      g.beginPath();
      g.ellipse(0, 0, e[2], e[3], 0, 0, Math.PI * 2);
      g.fill();
      g.restore();
    });
  });

  for (let c = 0; c < 3; c++) {
    const rx = 190 + 40 * c;
    const tl = project(rx - 15, 420, 0);
    const tr = project(rx + 15, 420, 0);
    const br = project(rx + 15, 625, 0);
    const bl = project(rx - 15, 625, 0);
    const laneGr = g.createLinearGradient(0, tl.y, 0, bl.y);
    laneGr.addColorStop(0, 'rgba(0, 255, 255, 0.02)');
    laneGr.addColorStop(0.5, 'rgba(255, 140, 0, 0.14)');
    laneGr.addColorStop(1, 'rgba(255, 50, 0, 0.24)');
    g.fillStyle = laneGr;
    g.beginPath();
    g.moveTo(tl.x, tl.y); g.lineTo(tr.x, tr.y); g.lineTo(br.x, br.y); g.lineTo(bl.x, bl.y);
    g.closePath();
    g.fill();

    g.strokeStyle = 'rgba(0, 255, 220, 0.28)';
    g.lineWidth = 2;
    for (let ay = 395; ay <= 412; ay += 8) {
      const aL = project(rx - 7, ay, 0);
      const aM = project(rx, ay + 6, 0);
      const aR = project(rx + 7, ay, 0);
      g.beginPath();
      g.moveTo(aL.x, aL.y); g.lineTo(aM.x, aM.y); g.lineTo(aR.x, aR.y);
      g.stroke();
    }
  }

  for (let c = 0; c < 3; c++) {
    const x = 190 + 40 * c;
    const tl = project(x - 13, 428, 0);
    const tr = project(x + 13, 428, 0);
    const br = project(x + 13, 574, 0);
    const bl = project(x - 13, 574, 0);

    g.fillStyle = 'rgba(10, 5, 25, 0.8)';
    g.strokeStyle = '#ff8c1a';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(tl.x, tl.y); g.lineTo(tr.x, tr.y); g.lineTo(br.x, br.y); g.lineTo(bl.x, bl.y);
    g.closePath();
    g.fill();
    g.stroke();

  }
  g.restore();
}

/* partes animadas do tapete: luzes, LEDs (sprites em cache) e ondas de choque */
const LED_COLS = ['#ff2a55', '#c850ff', '#ffffff', '#00e676', '#ff9100', '#ffee00', '#00f6ff'];
function drawFieldLight(i, on) {
  const p = project(250 + i * 24, 345 - i * 18, 0);
  const c = ['#ffee33', '#ffffff', '#d580ff'][i % 3];
  g.save();
  g.translate(p.x, p.y);
  g.scale(p.s, p.syScale);
  g.fillStyle = '#120b24';
  g.beginPath(); g.arc(0, 0, 10, 0, Math.PI * 2); g.fill();
  g.fillStyle = on ? c : '#241a3a';
  g.shadowColor = c;
  g.shadowBlur = on ? 16 : 0;
  g.strokeStyle = c;
  g.lineWidth = 2;
  g.beginPath(); g.arc(0, 0, 7.5, 0, Math.PI * 2); g.fill(); g.stroke();
  g.restore();
}
function drawFieldLed(c, j, on) {
  const lp = project(190 + 40 * c, 440 + 20 * j, 0);
  g.save();
  g.translate(lp.x, lp.y);
  g.scale(lp.s, lp.syScale);
  g.fillStyle = on ? LED_COLS[j] : '#1f1633';
  g.shadowColor = LED_COLS[j];
  g.shadowBlur = on ? 13 : 0;
  g.beginPath(); g.arc(0, 0, 6.8, 0, Math.PI * 2); g.fill();
  g.restore();
}
function drawFieldDynamic() {
  g.save();
  traceProjectedPoly(playfieldPts, 0);
  g.clip();
  for (let i = 0; i < 6; i++) {
    const on = i < hits % 7, p = project(250 + i * 24, 345 - i * 18, 0);
    drawCachedAt('L' + i + (on ? 1 : 0), p, 10 * Math.max(p.s, p.syScale), () => drawFieldLight(i, on));
  }
  for (let c = 0; c < 3; c++) {
    for (let j = 0; j < 7; j++) {
      const on = 6 - j < lvl[c], lp = project(190 + 40 * c, 440 + 20 * j, 0);
      drawCachedAt('R' + c + '_' + j + (on ? 1 : 0), lp, 7 * Math.max(lp.s, lp.syScale), () => drawFieldLed(c, j, on));
    }
  }
  for (const sw of shockwaves) {
    const p = project(sw.x, sw.y, 0);
    const alpha = Math.max(0, sw.life / sw.maxLife);
    g.save();
    g.translate(p.x, p.y);
    g.scale(p.s, p.syScale);
    g.strokeStyle = sw.col;
    g.globalAlpha = alpha * 0.75;
    g.lineWidth = 3 * alpha;
    g.beginPath();
    g.arc(0, 0, sw.r, 0, Math.PI * 2);
    g.stroke();
    g.restore();
  }
  g.globalAlpha = 1;
  g.restore();
}

/* camada estática pré-renderizada: gabinete + mesa + paredes (desenhada 1x por resize) */
function buildStaticLayers() {
  layerA = document.createElement('canvas');
  layerA.width = Math.round(w * dpr); layerA.height = Math.round(h * dpr);
  const k = layerA.getContext('2d');
  k.setTransform(dpr, 0, 0, dpr, 0, 0);
  k.lineCap = 'round'; k.lineJoin = 'round';
  const prev = g; g = k;
  camShakeX = camShakeY = 0;
  try { drawCabinetStatic(); drawPlayfieldSurface(); drawWalls3D(); } finally { g = prev; }
}

/* ---------- PAREDES 3D EXTRUDADAS ---------- */
function drawWalls3D() {
  const wallH = 18;
  g.lineCap = 'round';
  g.lineJoin = 'round';

  for (const q of walls) {
    const b1 = project(q[0], q[1], 0);
    const b2 = project(q[2], q[3], 0);
    const t1 = project(q[0], q[1], wallH);
    const t2 = project(q[2], q[3], wallH);

    g.fillStyle = 'rgba(150, 20, 20, 0.45)';
    g.beginPath();
    g.moveTo(b1.x, b1.y);
    g.lineTo(b2.x, b2.y);
    g.lineTo(t2.x, t2.y);
    g.lineTo(t1.x, t1.y);
    g.closePath();
    g.fill();
  }

  g.shadowColor = '#ff5a00';
  g.shadowBlur = 16;
  g.strokeStyle = '#ff3a1a';
  g.lineWidth = 4.5;
  g.beginPath();
  for (const q of walls) {
    const t1 = project(q[0], q[1], wallH);
    const t2 = project(q[2], q[3], wallH);
    g.moveTo(t1.x, t1.y);
    g.lineTo(t2.x, t2.y);
  }
  g.stroke();

  g.shadowBlur = 0;
  g.strokeStyle = '#ffd9a0';
  g.lineWidth = 1.5;
  g.beginPath();
  for (const q of walls) {
    const t1 = project(q[0], q[1], wallH);
    const t2 = project(q[2], q[3], wallH);
    g.moveTo(t1.x, t1.y);
    g.lineTo(t2.x, t2.y);
  }
  g.stroke();
}

/* ---------- ELEMENTOS 3D DO PLAYFIELD (ORDENADOS POR PROFUNDIDADE Y) ---------- */
function drawSlingshot3D(q, idx) {

    const p1 = project(a[0], a[1], 0), p2 = project(bPt[0], bPt[1], 0);

function drawPost3D(o) {

function drawBumper3D(o) {
  const hZ = 24;
  const scaleFactor = 1 + o.f * 0.14;
  const pBot = project(o.x, o.y, 0);
  const pTop = project(o.x, o.y, hZ);
  const rx = o.r * pBot.s * scaleFactor;
  const ry = o.r * pBot.syScale * scaleFactor;

  g.fillStyle = 'rgba(0, 0, 0, 0.52)';
  g.beginPath();
  g.ellipse(pBot.x + 3 * pBot.s, pBot.y + 4 * pBot.syScale, rx * 1.08, ry * 1.08, 0, 0, Math.PI * 2);
  g.fill();

  const bodyGr = g.createLinearGradient(pBot.x - rx, 0, pBot.x + rx, 0);
  bodyGr.addColorStop(0, '#3a0c04');
  bodyGr.addColorStop(0.5, o.c);
  bodyGr.addColorStop(1, '#1a0402');
  g.fillStyle = bodyGr;
  g.beginPath();
  g.ellipse(pBot.x, pBot.y, rx, ry, 0, 0, Math.PI);
  g.lineTo(pTop.x - rx, pTop.y);
  g.ellipse(pTop.x, pTop.y, rx, ry, 0, Math.PI, 0, true);
  g.closePath();
  g.fill();

  g.strokeStyle = o.c;
  g.lineWidth = 2;
  g.beginPath();
  g.ellipse(pBot.x, pBot.y, rx, ry, 0, 0, Math.PI);
  g.stroke();

  g.save();
  g.translate(pTop.x, pTop.y);
  g.scale(1, ry / Math.max(1, rx));

  const topGr = g.createRadialGradient(-rx * 0.25, -rx * 0.25, 2, 0, 0, rx);
  topGr.addColorStop(0, o.f > 0 ? '#ffffff' : '#8a5a14');
  topGr.addColorStop(0.65, o.c);
  topGr.addColorStop(1, '#3a0a02');

  g.shadowColor = o.glow;
  g.shadowBlur = 14 + o.f * 32;
  g.fillStyle = topGr;
  g.beginPath();
  g.arc(0, 0, rx, 0, Math.PI * 2);
  g.fill();

  g.lineWidth = 3.2;
  g.strokeStyle = o.f > 0 ? '#ffffff' : o.c;
  g.stroke();
  g.shadowBlur = 0;

  g.rotate(o.rot);
  g.strokeStyle = 'rgba(255, 255, 255, 0.72)';
  g.lineWidth = 2.2;
  for (let k = 0; k < 3; k++) {
    const ang = (k * Math.PI * 2) / 3;
    g.beginPath();
    g.moveTo(Math.cos(ang) * (rx * 0.28), Math.sin(ang) * (rx * 0.28));
    g.lineTo(Math.cos(ang) * (rx * 0.72), Math.sin(ang) * (rx * 0.72));
    g.stroke();
  }

  g.fillStyle = o.f > 0 ? '#ffffff' : '#ffd6e0';
  g.beginPath();
  g.arc(0, 0, rx * 0.26, 0, Math.PI * 2);
  g.fill();
  g.restore();
}

function drawRocket3D(c, t) {

  g.moveTo(baseP.x, baseP.y);

function drawFlipper3D(f) {

function drawPlungerAndReserve3D() {
  const springTopY = 877 + power * 28 - plungerSpringOffset * 6;
  const springBottomY = 912;
  g.strokeStyle = '#a8b8e0';
  g.lineWidth = 2.8;
  g.beginPath();
  const coils = 6;
  for (let i = 0; i <= coils; i++) {
    const sy = springTopY + ((springBottomY - springTopY) * i) / coils;
    const sx = i === 0 || i === coils ? 460 : 460 + (i % 2 === 0 ? -9 : 9);
    const p = project(sx, sy, 8);
    if (i === 0) g.moveTo(p.x, p.y);
    else g.lineTo(p.x, p.y);
  }
  g.stroke();

  const plL = project(448, springTopY - 2, 10);
  const plR = project(472, springTopY - 2, 10);
  g.strokeStyle = '#ff00cc';
  g.lineWidth = 5;
  g.beginPath();
  g.moveTo(plL.x, plL.y);
  g.lineTo(plR.x, plR.y);
  g.stroke();

  const reserveBalls = Math.max(0, balls - 1);
  const troughPts = [[348, 845], [434, 845], [434, 876], [348, 876]];
  traceProjectedPoly(troughPts, 4);
  g.fillStyle = 'rgba(8, 3, 24, 0.88)';
  g.strokeStyle = 'rgba(0, 246, 255, 0.55)';
  g.lineWidth = 1.8;
  g.fill();
  g.stroke();

  const feedA = project(434, 861, 6);
  const feedB = project(446, 866, 6);
  g.strokeStyle = 'rgba(255, 0, 204, 0.6)';
  g.lineWidth = 2.5;
  g.beginPath();
  g.moveTo(feedA.x, feedA.y);
  g.lineTo(feedB.x, feedB.y);
  g.stroke();

  const visibleReserveSlots = Math.min(3, Math.max(2, reserveBalls));
  for (let i = 0; i < visibleReserveSlots; i++) {
    const rx = 418 - i * 22;
    const ry = 861;
    const bp = project(rx, ry, 10);
    const rad = 8 * bp.s;
    const hasBall = i < reserveBalls;

    if (hasBall) {
      const rGr = g.createRadialGradient(bp.x - rad * 0.3, bp.y - rad * 0.3, 1, bp.x, bp.y, rad);
      rGr.addColorStop(0, '#ffffff');
      rGr.addColorStop(0.45, '#99ffff');
      rGr.addColorStop(1, '#0088cc');
      g.shadowColor = '#00f6ff';
      g.shadowBlur = 10;
      g.fillStyle = rGr;
      g.beginPath();
      g.arc(bp.x, bp.y, rad, 0, Math.PI * 2);
      g.fill();
      g.shadowBlur = 0;
    } else {
      g.fillStyle = 'rgba(255, 255, 255, 0.06)';
      g.strokeStyle = 'rgba(0, 246, 255, 0.25)';
      g.lineWidth = 1.2;
      g.beginPath();
      g.arc(bp.x, bp.y, rad * 0.88, 0, Math.PI * 2);
      g.fill();
      g.stroke();
    }
  }
  if (reserveBalls > 3) {
    const exP = project(360, 861, 12);
    glowText('+' + (reserveBalls - 3), exP.x, exP.y, 12, '#ffee00', 'center', MONO, 8);
  }

  const barBot = project(492, 870, 12);
  const barTop = project(492, 700, 12);
  g.strokeStyle = 'rgba(255, 255, 255, 0.14)';
  g.lineWidth = 8;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(barBot.x, barBot.y);
  g.lineTo(barTop.x, barTop.y);
  g.stroke();

  if (state === 'play' && waiting && power > 0) {
    const curTop = project(492, 870 - 170 * power, 12);
    const gr = g.createLinearGradient(0, barBot.y, 0, barTop.y);
    gr.addColorStop(0, '#00f6ff');
    gr.addColorStop(0.5, '#ff00ee');
    gr.addColorStop(1, '#ffee00');
    g.strokeStyle = gr;
    g.shadowColor = '#ff00ee';
    g.shadowBlur = 14;
    g.lineWidth = 8;
    g.beginPath();
    g.moveTo(barBot.x, barBot.y);
    g.lineTo(curTop.x, curTop.y);
    g.stroke();
    g.shadowBlur = 0;
  }
}

function drawBall3D() {
  if (!((state === 'play' && lost <= 0) || (state === 'play' && b.y < VH))) return;

  trail.forEach((pt, i) => {
    const ratio = i / trail.length;
    const p = project(pt[0], pt[1], R * 0.9);
    g.fillStyle = `rgba(0, 246, 255, ${ratio * 0.28})`;
    g.beginPath();
    g.arc(p.x, p.y, R * p.s * ratio * 0.92, 0, Math.PI * 2);
    g.fill();
  });

  const pFloor = project(b.x, b.y, 0);
  g.fillStyle = 'rgba(0, 0, 0, 0.55)';
  g.beginPath();
  g.ellipse(
    pFloor.x + 3 * pFloor.s,
    pFloor.y + 3 * pFloor.syScale,
    R * pFloor.s * 1.05,
    R * pFloor.syScale * 1.05,
    0, 0, Math.PI * 2
  );
  g.fill();

  const pBall = project(b.x, b.y, R);
  const rad = R * pBall.s;
  const gr = g.createRadialGradient(pBall.x - rad * 0.35, pBall.y - rad * 0.35, 1, pBall.x, pBall.y, rad);
  gr.addColorStop(0, '#ffffff');
  gr.addColorStop(0.35, '#e8eef8');
  gr.addColorStop(0.75, '#8a96b0');
  gr.addColorStop(1, '#2a3042');

  g.shadowColor = '#00f6ff';
  g.shadowBlur = 18;
  g.fillStyle = gr;
  g.beginPath();
  g.arc(pBall.x, pBall.y, rad, 0, Math.PI * 2);
  g.fill();
  g.shadowBlur = 0;

  g.fillStyle = '#ffffff';
  g.beginPath();
  g.arc(pBall.x - rad * 0.32, pBall.y - rad * 0.32, rad * 0.22, 0, Math.PI * 2);
  g.fill();
}

/* ---------- RENDERIZAÇÃO DO PAINEL TOP GLOBAL & SELETOR ARCADE ---------- */
function drawLeaderboardBox(cx, topY, boxW, maxItems) {
  const rowH = 22;
  const count = Math.min(maxItems, leaderboard.length);
  const boxH = 34 + Math.max(1, count) * rowH;
  const bx = cx - boxW * 0.5;

  g.fillStyle = 'rgba(6, 2, 18, 0.82)';
  g.strokeStyle = 'rgba(255, 0, 238, 0.45)';
  g.lineWidth = 1.5;
  g.beginPath();
  g.roundRect(bx, topY, boxW, boxH, 12);
  g.fill();
  g.stroke();

  glowText('★ TOP ' + maxItems + ' GLOBAL ★', cx, topY + 15, 12, '#ff44ee', 'center', FONT, 10);

  if (count === 0) {
    glowText(lbStatus || 'SEM RECORDES AINDA', cx, topY + 38, 12, '#7af8ff', 'center', MONO, 6);
    return;
  }

  const rankColors = ['#ffee00', '#e0f7ff', '#ff9d44', '#7af8ff', '#7af8ff'];
  for (let i = 0; i < count; i++) {
    const entry = leaderboard[i];
    const ry = topY + 36 + i * rowH;
    const isCurrent = state === 'over' && entry.score === score && score > 0;
    const col = isCurrent ? '#00ff88' : (rankColors[i] || '#7af8ff');

    glowText(`#${i + 1}`, bx + 18, ry, 13, col, 'left', MONO, 6);
    glowText(entry.name, bx + 56, ry, 14, col, 'left', FONT, 8);
    glowText(String(entry.score).padStart(7, '0'), bx + boxW - 18, ry, 14, col, 'right', MONO, 8);
  }
}

function drawArcadeInitialsPicker(cx, topY, boxW, pulse) {
  const boxH = 148;
  const bx = cx - boxW * 0.5;

  g.fillStyle = 'rgba(10, 3, 28, 0.92)';
  g.strokeStyle = '#ffee00';
  g.lineWidth = 2;
  g.shadowColor = '#ffee00';
  g.shadowBlur = 14;
  g.beginPath();
  g.roundRect(bx, topY, boxW, boxH, 14);
  g.fill();
  g.stroke();
  g.shadowBlur = 0;

  glowText('★ NOVO RECORDE NO TOP 10! ★', cx, topY + 20, 14, '#ffee00', 'center', FONT, 12);

  const slotSpacing = 54;
  const startX = cx - slotSpacing;
  const charY = topY + 72;

  for (let i = 0; i < 3; i++) {
    const sx = startX + i * slotSpacing;
    const active = i === cursorSlot;
    const ch = CHARS[initialsIdx[i]];

    if (active) {
      g.fillStyle = 'rgba(0, 246, 255, 0.14)';
      g.strokeStyle = '#00f6ff';
      g.lineWidth = 2;
      g.beginPath();
      g.roundRect(sx - 20, charY - 26, 40, 52, 8);
      g.fill();
      g.stroke();

      g.globalAlpha = pulse;
      glowText('▲', sx, charY - 35, 11, '#00f6ff', 'center', MONO, 6);
      glowText('▼', sx, charY + 35, 11, '#00f6ff', 'center', MONO, 6);
      g.globalAlpha = 1;
    }

    glowText(ch, sx, charY + 2, 30, active ? '#00f6ff' : '#ffffff', 'center', FONT, active ? 16 : 6);
  }

  glowText('← → MOVER   |   ↑ ↓ LETRA   |   ENTER CONFIRMAR', cx, topY + 128, 11, '#7af8ff', 'center', MONO, 6);
}

/* ---------- LOOP DE RENDERIZAÇÃO PRINCIPAL ---------- */
function draw(t) {
  if (!w || !h || !bgStatic || !layerA) return;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  const sh = shake * 8;
  drawAnimatedBg(t);

  g.save();
  if (sh > 0.01) {
    const ms = project(250, 450, 0).s;
    g.translate((Math.random() - .5) * sh * ms, (Math.random() - .5) * sh * ms);
  }
  g.drawImage(layerA, 0, 0, w, h);
  drawCabinetHUD();
  drawFieldDynamic();

  const renderables = [];
  bumpers.forEach(o => renderables.push({ y: o.y, fn: () => drawBumper3D(o) }));
  posts.forEach(o => renderables.push({ y: o.y, fn: () => drawPost3D(o) }));
  slings.forEach((q, idx) => renderables.push({ y: q[3], fn: () => drawSlingshot3D(q, idx) }));
  for (let c = 0; c < 3; c++) renderables.push({ y: 590, fn: () => drawRocket3D(c, t) });
  fl.forEach(f => renderables.push({ y: f.py, fn: () => drawFlipper3D(f) }));
  renderables.push({ y: b.y, fn: () => drawBall3D() });

  renderables.sort((a, bObj) => a.y - bObj.y);
  for (const item of renderables) item.fn();

  drawPlungerAndReserve3D();

  for (const p of particles) {
    const pp = project(p.x, p.y, 12);
    const alpha = Math.max(0, p.life / p.maxLife);
    const rad = p.size * pp.s * alpha, a = Math.min(1, alpha);
    g.fillStyle = p.col;
    g.globalAlpha = a * 0.3;
    g.beginPath(); g.arc(pp.x, pp.y, rad + 3, 0, Math.PI * 2); g.fill();
    g.globalAlpha = a;
    g.beginPath(); g.arc(pp.x, pp.y, rad, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;

  for (const p of popups) {
    const pp = project(p.x, p.y, 24);
    const alpha = Math.min(1, (p.life / p.maxLife) * 1.4);
    g.globalAlpha = alpha;
    glowText(p.text, pp.x, pp.y, Math.max(12, p.size * pp.s), p.col, 'center', FONT, 10);
  }
  g.globalAlpha = 1;

  g.save();
  traceProjectedPoly(playfieldPts, 18);
  const glassGr = g.createLinearGradient(0, 0, w, h);
  glassGr.addColorStop(0, 'rgba(255, 255, 255, 0.05)');
  glassGr.addColorStop(0.38, 'rgba(255, 255, 255, 0.0)');
  glassGr.addColorStop(0.52, 'rgba(255, 255, 255, 0.03)');
  glassGr.addColorStop(0.68, 'rgba(255, 255, 255, 0.0)');
  glassGr.addColorStop(1, 'rgba(0, 255, 255, 0.03)');
  g.fillStyle = glassGr;
  g.fill();

  if (flashScreen > 0) {
    g.fillStyle = flashCol;
    g.globalAlpha = flashScreen * 0.35;
    g.fill();
    g.globalAlpha = 1;
  }
  g.restore();

  if (msgT > 0 && msg) {
    const mp = project(240, 620, 30);
    const scalePop = 1 + Math.sin(Math.min(1, msgT) * Math.PI) * 0.1;
    g.save();
    g.translate(mp.x, mp.y);
    g.scale(scalePop, scalePop);
    glowText(msg, 0, 0, Math.min(34, w * 0.042), msgCol, 'center', FONT, 18);
    g.restore();
  }

  g.restore();

  /* ---------- SOBREPOSIÇÃO DE INÍCIO / FIM DE JOGO ---------- */
  if (state !== 'play') {
    g.fillStyle = 'rgba(3, 0, 12, 0.78)';
    g.fillRect(0, 0, w, h);

    const pulse = 0.55 + 0.45 * Math.sin(t / 280);
    const modalW = Math.min(540, w * 0.90);
    const modalH = Math.min(510, h * 0.86);
    const mx = (w - modalW) * 0.5;
    const my = (h - modalH) * 0.5 + 10;

    const MP = 44;
    const mSpr = getSprite('modal|' + modalW.toFixed(1) + 'x' + modalH.toFixed(1), modalW + MP * 2, modalH + MP * 2, k => {
      k.fillStyle = 'rgba(12, 4, 30, 0.92)';
      k.strokeStyle = '#00f6ff';
      k.lineWidth = 2.5;
      k.shadowColor = '#00f6ff';
      k.shadowBlur = 22;
      k.beginPath();
      k.roundRect(MP, MP, modalW, modalH, 24);
      k.fill();
      k.stroke();
    });
    g.drawImage(mSpr, mx - MP, my - MP, mSpr.width / dpr, mSpr.height / dpr);

    const cx = w * 0.5;
    if (state === 'start') {
      glowText('NEON METEOR 2077', cx, my + modalH * 0.15, Math.min(40, modalW * 0.08), '#00f6ff', 'center', FONT, 20);
      glowText('ARCADE 2.5D WIDESCREEN', cx, my + modalH * 0.25, Math.min(16, modalW * 0.034), '#ff00ee', 'center', FONT, 14);

      drawLeaderboardBox(cx, my + modalH * 0.32, modalW * 0.84, 3);

      g.globalAlpha = pulse;
      glowText('PRESSIONE ESPAÇO OU ENTER PARA INICIAR', cx, my + modalH * 0.67, Math.min(15, modalW * 0.031), '#ffffff', 'center', FONT, 14);
      g.globalAlpha = 1;

      glowText('← → / Z M / SHIFT : FLIPPERS', cx, my + modalH * 0.80, Math.min(13, modalW * 0.025), '#7af8ff', 'center', MONO, 8);
      glowText('SEGURE ESPAÇO / ↓ : LANÇAR   |   A / D / ↑ : BALANÇAR', cx, my + modalH * 0.89, Math.min(12, modalW * 0.023), '#7af8ff', 'center', MONO, 8);
    } else {
      glowText('FIM DE JOGO', cx, my + modalH * 0.12, Math.min(36, modalW * 0.075), '#ff2a55', 'center', FONT, 20);
      glowText('PONTUAÇÃO FINAL: ' + String(score).padStart(7, '0'), cx, my + modalH * 0.23, Math.min(22, modalW * 0.045), '#00f6ff', 'center', FONT, 14);
      glowText(
        score >= best && score > 0 ? '★ NOVO RECORDE! ★' : 'RECORDE: ' + String(best).padStart(7, '0'),
        cx, my + modalH * 0.32, Math.min(15, modalW * 0.031), '#ffee00', 'center', FONT, 12
      );

      if (enteringInitials) {
        drawArcadeInitialsPicker(cx, my + modalH * 0.40, modalW * 0.84, pulse);
      } else {
        drawLeaderboardBox(cx, my + modalH * 0.39, modalW * 0.84, 5);
        g.globalAlpha = pulse;
        glowText('PRESSIONE ESPAÇO OU ENTER PARA JOGAR', cx, my + modalH * 0.90, Math.min(15, modalW * 0.031), '#ffffff', 'center', FONT, 14);
        g.globalAlpha = 1;
      }
    }
  }
}

/* ---------- LOOP PRINCIPAL ---------- */
let last = 0, perfN = 0, perfSum = 0, perfWarm = 40;
/* se o aparelho não sustentar ~50fps, reduz a resolução interna do canvas em degraus */
function adaptQuality(delta) {
  if (delta > 250) return;
  if (perfWarm > 0) { perfWarm--; return; }
  perfSum += delta; perfN++;
  if (perfN < 45) return;
  const avg = perfSum / perfN;
  perfSum = 0; perfN = 0;
  if (avg > 20) {
    const cur = Math.min(devicePixelRatio || 1, maxDpr);
    const next = [1.5, 1.25, 1].find(v => v < cur);
    if (next) { maxDpr = next; perfWarm = 30; resize(); }
  }
}
function loop(t) {
  const dt = Math.min((t - last) / 1000 || 0, 1 / 30);
  adaptQuality(t - last);
  last = t;
  update(dt);
  draw(t);
  requestAnimationFrame(loop);
}

spawn();
resize();
requestAnimationFrame(loop);
</script>
